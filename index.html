<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>CHAOTEN</title>
  <meta name="application-name" content="CHAOTEN">
  <meta name="apple-mobile-web-app-title" content="CHAOTEN">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <meta name="referrer" content="no-referrer">

  <link rel="icon" type="image/png" sizes="512x512" href="./chaoten_app_icon_512.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./chaoten_app_icon_512.png">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .card {
      width: min(100%, 420px);
      text-align: center;
    }

    .logo {
      width: min(70vw, 260px);
      height: auto;
      display: block;
      margin: 0 auto 18px;
    }

    .chaoten-wordmark {
      width: min(88vw, 360px);
      height: auto;
      display: block;
      margin: 0 auto 28px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 18px 20px;
      border-radius: 14px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: .4px;
    }
  </style>
</head>

<body>

  <main class="card">
    <img
      class="logo"
      src="./chaoten_app_icon_512.png"
      alt="CHAOTEN Löwe"
    >

    <img
      class="chaoten-wordmark"
      src="./chaoten_30_jahre_old_london.png"
      alt="30 Jahre CHAOTEN"
    >

    <a
      class="button"
      id="openTicketing"
      href="#"
    >
      TICKETING ÖFFNEN
    </a>
  </main>

  <script>

    const APP_URL =
      'https://script.google.com/macros/s/AKfycbwQgNiePj8WBayQhKjKW5WT8smkvCy5bZ30IJM6zb9E8iRccT_uen92EL63yjKM3K0vvg/exec';


    /*
     * WICHTIG:
     * Jeder Start über das CHAOTEN-Icon bekommt
     * eine neue, neutrale Start-URL.
     *
     * Dadurch werden alte Ticket-/Gruppenansichten
     * nicht als Startzustand wiederverwendet.
     */

    function freshStartUrl() {

      return (
        APP_URL +
        '?home=1&start=' +
        Date.now()
      );
    }


    document
      .getElementById('openTicketing')
      .addEventListener(
        'click',
        function(event) {

          event.preventDefault();

          window.location.replace(
            freshStartUrl()
          );
        }
      );


    /*
     * Wurde diese Seite über das installierte
     * CHAOTEN-Home-Screen-Icon geöffnet?
     */

    const standalone =
      window.navigator.standalone === true ||
      window.matchMedia(
        '(display-mode: standalone)'
      ).matches;


if (standalone) {

  setTimeout(
    function() {

      window.location.replace(
        freshStartUrl()
      );

    },
    1500
  );
}

  </script>

</body>
</html>
