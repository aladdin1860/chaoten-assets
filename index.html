<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>CHAOTEN</title>
  <meta name="application-name" content="CHAOTEN">
  <meta name="apple-mobile-web-app-title" content="CHAOTEN">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">

  <link rel="icon" type="image/png" sizes="512x512" href="./chaoten_app_icon_512.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./chaoten_app_icon_512.png">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }
    .card {
      width: min(100%, 420px);
      text-align: center;
    }
    .logo {
      width: min(70vw, 260px);
      height: auto;
      display: block;
      margin: 0 auto 22px;
    }
    h1 {
      margin: 0 0 28px;
      font-size: 34px;
      letter-spacing: 2px;
    }
    .button {
      display: block;
      width: 100%;
      padding: 18px 20px;
      border-radius: 14px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: .4px;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="./chaoten_app_icon_512.png" alt="CHAOTEN">
    <h1>CHAOTEN</h1>
    <a class="button" href="https://script.google.com/macros/s/AKfycbwQgNiePj8WBayQhKjKW5WT8smkvCy5bZ30IJM6zb9E8iRccT_uen92EL63yjKM3K0vvg/exec">TICKETING ÖFFNEN</a>
  </main>

  <script>
    // Beim Aufruf als installierte Home-Screen-Web-App direkt ins Ticketing.
    const standalone =
      window.navigator.standalone === true ||
      window.matchMedia('(display-mode: standalone)').matches;

    if (standalone) {
      window.location.replace('https://script.google.com/macros/s/AKfycbwQgNiePj8WBayQhKjKW5WT8smkvCy5bZ30IJM6zb9E8iRccT_uen92EL63yjKM3K0vvg/exec');
    }
  </script>
</body>
</html>
